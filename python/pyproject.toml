[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fheroes2-env"
version = "0.0.1"
description = "Python control transport for the fheroes2 engine"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium>=1.1,<2", "numpy>=1.26,<3"]
viewer = ["gymnasium>=1.1,<2", "numpy>=1.26,<3", "pygame-ce>=2.5.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]
